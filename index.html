<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="有車未">
<title>有車未</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#101418; --surface:#171e24; --surface-2:#212a32; --line:#2d3942; --fg:#f3f6f4; --muted:#9aa7b0; --faint:#738088; --accent:#e4a23a; --ink:#1c1408; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Noto Sans TC", "Barlow", sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .app { max-width: 48rem; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 12px 8px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
  .kicker, .path, .hint, .mode, .sub, footer { color: var(--muted); }
  .kicker, .hint, .mode, footer { font-size: 0.75rem; }
  .clock { font-family: Barlow, sans-serif; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
  .tabs button { min-height: 44px; border-radius: 999px; padding: 0 2px; background: var(--surface-2); font-size: 0.75rem; line-height: 1.2; }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--ink); font-weight: 600; }
  .path { margin: 8px 0 0; font-size: 0.875rem; }
  .path span { color: var(--faint); }
  .hero, .cell, .sk { background: var(--surface); border-radius: 16px; }
  .hero { margin: 12px 12px 0; padding: 12px; }
  .hero.soon { background: var(--accent); color: var(--ink); }
  .hero .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .hero strong { font-size: 1.125rem; }
  .big { font-family: Barlow, sans-serif; font-size: 2.25rem; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
  h2 { display: flex; align-items: center; gap: 8px; margin: 14px 12px 0; font-size: 0.75rem; font-weight: 500; color: var(--muted); }
  h2 i { width: 2px; height: 12px; background: var(--accent); display: block; }
  .hint { margin: 4px 12px 0; }
  .board { display: grid; grid-template-columns: 1fr 1fr; }
  article { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  .id { display: flex; gap: 8px; }
  .code { width: 3.5rem; flex: 0 0 auto; font-family: Barlow, sans-serif; font-size: 1.25rem; font-weight: 600; line-height: 1; }
  .etas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; }
  .etas.four { grid-template-columns: repeat(4, 1fr); }
  .cell { border-radius: 8px; padding: 6px; }
  .cell.soon .count { color: var(--accent); }
  .count { font-family: Barlow, sans-serif; font-size: 1.125rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .meta { margin-top: 4px; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .alight, .empty { font-size: 0.75rem; color: var(--faint); }
  .sk { height: 96px; margin: 8px 12px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
  footer { border-top: 1px solid var(--line); text-align: center; padding: 8px 12px 12px; }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div>
        <div class="kicker">香港交通到站</div>
        <h1 id="title">文康弦返學</h1>
      </div>
      <div style="display:flex;align-items:center">
        <div class="clock" id="clock">--:--:--</div>
        <button id="reload" aria-label="立即更新" style="width:44px;height:44px">↻</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <div id="body" style="flex:1"></div>
</div>
<script>
const SCENARIOS = [
  { id:"school", short:"返學", title:"文康弦返學", path:"藍地 → 華都", detail:"九巴 53、63X、68A、258P、960P" },
  { id:"to-hom", short:"置樂去何文田", title:"置樂去何文田", path:"置樂 → 屯門站 → 何文田", detail:"港鐵巴士 K51 / K52 / K53，再轉屯馬線" },
  { id:"to-lamtei", short:"置樂返藍地", title:"置樂返藍地", path:"置樂 → 藍地", detail:"九巴 53，或邨巴 :10 / :40" },
  { id:"to-work", short:"返工", title:"返工去何文田", path:"藍地 → 兆康 → 何文田", detail:"輕鐵往兆康，再轉屯馬線" },
  { id:"from-work", short:"返工返置樂", title:"返工返置樂", path:"何文田 → 屯門站 → 恆順園", detail:"屯馬線往屯門，再轉港鐵巴士" },
  { id:"from-lamtei", short:"放工返藍地", title:"放工返藍地", path:"何文田 → 兆康 → 藍地", detail:"屯馬線往兆康，再轉輕鐵" }
];
const SCHOOL = [
  ["53","46D1A9FD1F84CA5C","藍地站上車","往荃灣如心 · 約 11 分鐘到華都",11],
  ["63X","46D1A9FD1F84CA5C","藍地站上車","往西九龍 · 約 8 分鐘到華都",8],
  ["68A","46D1A9FD1F84CA5C","藍地站上車","往青衣站 · 約 8 分鐘到華都",8],
  ["258P","46D1A9FD1F84CA5C","藍地站上車","往藍田 · 約 12 分鐘到華都",12],
  ["960P","46D1A9FD1F84CA5C","藍地站上車","往銅鑼灣 · 約 10 分鐘到華都",10]
];
const BACK = [["53","459BE083B86A8337","置樂花園上車","往元朗形點 · 約 8 分鐘到藍地",8]];
const TO_STATION = [
  ["K51","K51-D180","置樂花園","往富泰 · 經屯門站"],
  ["K52","K52-nU100","置樂花園","往龍鼓灘 · 經屯門站"],
  ["K53","K53-D140","置樂花園","循環線回屯門站"]
];
const TO_HANDSOME = [
  ["K51","K51-U080","港鐵屯門站","往大欖 · 下一帶恆順園"],
  ["K52","K52-nD190","屯門站","往悅湖山莊 · 下一帶恆順園"],
  ["K53","K53-U010","屯門站","循環線 · 開出後經恆順園"]
];
let scenario = localStorage.getItem("hk-eta-scenario") || "school";
if (!SCENARIOS.some(s => s.id === scenario)) scenario = "school";
let sections = null, fetchedAt = 0, error = false, pending = false, token = 0;
const $ = id => document.getElementById(id);
function hk(ms, secs) {
  const opt = { hour:"2-digit", minute:"2-digit", hour12:false, timeZone:"Asia/Hong_Kong" };
  if (secs) opt.second = "2-digit";
  return new Date(ms).toLocaleTimeString("zh-HK", opt);
}
function colon(total) {
  total = Math.max(0, total|0);
  const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
  if (h) return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  return m+":"+String(s).padStart(2,"0");
}
function left(at) { return Math.max(0, Math.round((at - Date.now())/1000)); }
function upcoming(list) {
  const now = Date.now()-20000;
  return list.filter(e => e.at >= now).sort((a,b)=>a.at-b.at).slice(0,4);
}
async function kmb(routes) {
  return Promise.all(routes.map(async r => {
    try {
      const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${r[1]}/${r[0]}/1`);
      const data = await res.json();
      let dest = "";
      const etas = [];
      for (const item of data.data || []) {
        if (!dest && item.dest_tc) dest = item.dest_tc;
        if (!item.eta) continue;
        etas.push({ at: new Date(item.eta).getTime(), scheduled: !!item.rmk_tc });
      }
      return { code:r[0], mode:"九巴", heading: dest ? r[2]+" · 往"+dest : r[2], detail:r[3], alight:r[4], etas: upcoming(etas) };
    } catch { return { code:r[0], mode:"九巴", heading:r[2], detail:r[3], alight:r[4], etas:[] }; }
  }));
}
function village() {
  const start = new Date(); start.setMinutes(0,0,0);
  const base = start.getTime(), etas = [];
  for (let step=0; step<36 && etas.length<3; step++) {
    for (const minute of [10,40]) {
      const at = base + step*3600000 + minute*60000;
      if (at > Date.now()) etas.push({ at });
      if (etas.length>=3) break;
    }
  }
  return [{ code:"邨巴", mode:"屋邨", heading:"固定班次", detail:"每小時 :10 及 :40 開出", etas }];
}
async function buses(stops) {
  const routes = [...new Set(stops.map(s => s[0]))];
  const map = {};
  await Promise.all(routes.map(async route => {
    try {
      const res = await fetch("https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ language:"zh", routeName: route }) });
      map[route] = await res.json();
    } catch { map[route] = {}; }
  }));
  const now = Date.now();
  return stops.map(stop => {
    const found = (map[stop[0]].busStop || []).find(s => s.busStopId === stop[1]);
    const etas = [];
    for (const bus of (found && found.bus) || []) {
      const sec = Number(bus.arrivalTimeInSecond);
      if (!Number.isFinite(sec) || sec >= 10000) continue;
      etas.push({ at: now + sec*1000, scheduled: bus.isScheduled === "1" });
    }
    return { code: stop[0], mode:"港鐵巴士", heading: stop[2], detail: stop[3], etas: upcoming(etas) };
  });
}
async function train(sta, dest, heading, detail) {
  const row = { code:"屯馬", mode:"港鐵", heading, detail, etas:[] };
  try {
    const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=${sta}`);
    const data = await res.json();
    const station = data.data && data.data["TML-"+sta];
    const list = [...((station&&station.UP)||[]), ...((station&&station.DOWN)||[])].filter(t => t.dest===dest && t.time && t.valid!=="N");
    row.etas = upcoming(list.map(t => ({ at: new Date(t.time.replace(" ","T")+"+08:00").getTime(), platform: t.plat })));
  } catch {}
  return row;
}
function lrtSeconds(train) {
  const en = (train.time_en||"").toLowerCase(), ch = train.time_ch||"";
  if (en.includes("arriv") || en.includes("depart") || ch.includes("即將")) return 15;
  const m = en.match(/(\d+)/);
  return m ? Number(m[1])*60 : null;
}
async function lightRail(stationId, platformId, dests, heading, via) {
  try {
    const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${stationId}&with_special=1`);
    const data = await res.json();
    const platforms = (data.platform_list||[]).filter(p => platformId == null || p.platform_id === platformId);
    const groups = new Map(), now = Date.now();
    for (const platform of platforms) {
      for (const train of platform.route_list||[]) {
        const sec = lrtSeconds(train);
        if (sec==null || !train.route_no) continue;
        if (dests && dests.indexOf(train.dest_ch) < 0) continue;
        const key = train.route_no+"-"+(train.dest_ch||"");
        if (!groups.has(key)) groups.set(key, { code: train.route_no, dest: train.dest_ch||"", etas:[] });
        groups.get(key).etas.push({ at: now+sec*1000 });
      }
    }
    const order = ["610","614","615","751","505","507"];
    return [...groups.values()].sort((a,b)=>(order.indexOf(a.code)<0?50:order.indexOf(a.code))-(order.indexOf(b.code)<0?50:order.indexOf(b.code))).map(g => ({
      code:g.code, mode:"輕鐵", heading, detail:"往"+g.dest+" · "+via, etas: upcoming(g.etas)
    }));
  } catch { return []; }
}
async function load(id) {
  if (id==="school") return [{ label:"九巴 · 藍地 → 華都", rows: await kmb(SCHOOL) }];
  if (id==="to-hom") {
    const [bus, rail] = await Promise.all([buses(TO_STATION), train("TUM","WKS","屯門站開車","往烏溪沙 · 經何文田")]);
    return [{ label:"港鐵巴士 · 置樂 → 屯門站", rows: bus }, { label:"屯馬線 · 屯門站開車", rows:[rail] }];
  }
  if (id==="to-lamtei") return [{ label:"置樂 → 藍地", rows:[...(await kmb(BACK)), ...village()] }];
  if (id==="to-work") {
    const [rail, trainRow] = await Promise.all([lightRail(350, 2, null, "藍地站 2 號月台", "經兆康"), train("SIH","WKS","兆康站開車","往烏溪沙 · 經何文田")]);
    return [{ label:"輕鐵 · 藍地 → 兆康方向", hint:"只顯示往屯門碼頭／友愛，即途經兆康", rows: rail }, { label:"屯馬線 · 兆康站開車", rows:[trainRow] }];
  }
  if (id==="from-lamtei") {
    const [rail, lrt] = await Promise.all([
      train("HOM","TUM","何文田站","往屯門方向 · 兆康落車"),
      lightRail(100, 1, ["元朗","天逸"], "兆康站 1 號月台", "經藍地")
    ]);
    return [{ label:"屯馬線 · 何文田 → 兆康", rows:[rail] }, { label:"輕鐵 · 兆康 → 藍地", rows: lrt }];
  }
  const [rail, bus] = await Promise.all([train("HOM","TUM","何文田站","往屯門 · 唔好搭往烏溪沙"), buses(TO_HANDSOME)]);
  return [{ label:"屯馬線 · 何文田 → 屯門", rows:[rail] }, { label:"港鐵巴士 · 屯門站 → 恆順園", rows: bus }];
}
function firstEta() {
  const rows = (sections && sections[0] && sections[0].rows) || [];
  let best = null;
  for (const row of rows) {
    const eta = row.etas.find(e => e.at >= Date.now()-5000);
    if (eta && (!best || eta.at < best.at)) best = { row, at: eta.at };
  }
  return best;
}
function cell(eta, alight) {
  const sec = left(eta.at), soon = sec < 90;
  const alightAttr = alight == null ? "" : ` data-alight="${alight}"`;
  return `<div class="cell${soon?" soon":""}" data-at="${eta.at}"${alightAttr}><div class="count">${sec===0?"現在":colon(sec)}</div><div class="meta">${hk(eta.at,false)}${eta.scheduled?" 預":""}</div>${alight!=null?`<div class="alight alight-line">落 ${colon(sec+alight*60)}</div>`:""}${eta.platform?`<div class="alight">${eta.platform} 號月台</div>`:""}</div>`;
}
function paint() {
  const spec = SCENARIOS.find(s => s.id===scenario);
  $("title").textContent = spec.title;
  $("clock").textContent = hk(Date.now(), true);
  $("tabs").innerHTML = SCENARIOS.map(s => `<button type="button" data-id="${s.id}" aria-pressed="${s.id===scenario}">${s.short}</button>`).join("");
  $("reload").className = pending ? "spin" : "";
  if (!sections) {
    $("body").innerHTML = `<div class="board"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;
  } else {
    const atOf = row => (row.etas.find(e => e.at >= Date.now()-15000) || {}).at ?? Infinity;
    const rows = sections.flatMap(section => section.rows.slice().sort((a, b) => atOf(a) - atOf(b)));
    let soonest = null, soonestAt = Infinity;
    rows.forEach(row => { const at = atOf(row); if (at < soonestAt) { soonestAt = at; soonest = row; } });
    const cards = rows.map(row => {
      const visible = row.etas.filter(e => e.at >= Date.now()-15000).slice(0, 3);
      const first = soonest && row === soonest && visible.length;
      const wide = row.mode === "港鐵";
      const times = !visible.length ? `<div class="empty">暫無班次</div>` : wide
        ? `<div class="etas">${visible.map(eta => {
            const sec = left(eta.at);
            const soon = sec < 90;
            const extra = [row.alight != null ? "落 " + colon(sec + row.alight * 60) : "", eta.platform ? eta.platform + "號月台" : ""].filter(Boolean).join(" · ");
            return `<div data-at="${eta.at}"${row.alight != null ? ` data-alight="${row.alight}"` : ""}${eta.platform ? ` data-platform="${eta.platform}"` : ""}><div class="count" style="color:${soon ? "var(--accent)" : "inherit"}">${sec===0?"現在":colon(sec)}</div><div class="meta">${hk(eta.at,false)}${eta.scheduled?" 預":""}</div>${extra ? `<div class="alight alight-line">${extra}</div>` : ""}</div>`;
          }).join("")}</div>`
        : `<ul style="margin:6px 0 0;padding:0;list-style:none">${visible.map(eta => {
            const sec = left(eta.at);
            const soon = sec < 90;
            const extra = [row.alight != null ? "落 " + colon(sec + row.alight * 60) : "", eta.platform ? eta.platform + "號月台" : ""].filter(Boolean).join(" · ");
            return `<li data-at="${eta.at}"${row.alight != null ? ` data-alight="${row.alight}"` : ""}${eta.platform ? ` data-platform="${eta.platform}"` : ""}><div style="display:flex;justify-content:space-between;gap:4px"><span class="count" style="color:${soon ? "var(--accent)" : "inherit"}">${sec===0?"現在":colon(sec)}</span><span class="meta">${hk(eta.at,false)}${eta.scheduled?" 預":""}</span></div>${extra ? `<div class="alight alight-line">${extra}</div>` : ""}</li>`;
          }).join("")}</ul>`;
      const head = wide
        ? `<div class="id" style="justify-content:space-between"><div class="code" style="${first ? "color:var(--accent)" : ""}">${row.code}</div><div class="sub" style="flex:1;margin:0 8px;font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${row.heading}</div><div class="mode">${row.mode}</div></div>`
        : `<div class="id" style="justify-content:space-between"><div class="code" style="${first ? "color:var(--accent)" : ""}">${row.code}</div><div class="mode">${row.mode}</div></div><div class="sub" style="font-size:.75rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${row.heading}</div>`;
      return `<article style="${wide ? "grid-column:1 / -1;" : ""}${first ? "background:var(--surface)" : ""}">${head}${times}</article>`;
    }).join("");
    $("body").innerHTML = `<div class="board">${cards}</div>`;
  }
}
async function refresh() {
  const mine = ++token, id = scenario;
  pending = true; paint();
  try {
    const next = await load(id);
    if (mine !== token) return;
    sections = next; fetchedAt = Date.now(); error = false;
  } catch { if (mine===token) error = true; }
  finally { if (mine===token) { pending = false; paint(); } }
}
$("tabs").addEventListener("click", ev => {
  const id = ev.target && ev.target.dataset && ev.target.dataset.id;
  if (!id || id===scenario) return;
  scenario = id; localStorage.setItem("hk-eta-scenario", id); sections = null; refresh();
});
$("reload").addEventListener("click", () => refresh());
function tick() {
  $("clock").textContent = hk(Date.now(), true);
  document.querySelectorAll("[data-at]").forEach(el => {
    const sec = left(Number(el.dataset.at));
    const count = el.querySelector(".count");
    if (count) {
      count.textContent = sec === 0 ? "現在" : colon(sec);
      count.style.color = sec < 90 ? "var(--accent)" : "inherit";
    }
    const line = el.querySelector(".alight-line");
    if (line) {
      const parts = [];
      if (el.dataset.alight != null && el.dataset.alight !== "") parts.push("落 " + colon(sec + Number(el.dataset.alight) * 60));
      if (el.dataset.platform) parts.push(el.dataset.platform + "號月台");
      line.textContent = parts.join(" · ");
    }
  });
}
setInterval(tick, 1000);
setInterval(() => { if (document.visibilityState!=="hidden") refresh(); }, 15000);
refresh();
</script>
</body>
</html>
