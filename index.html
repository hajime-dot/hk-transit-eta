<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香港交通到站時間 - 情景模式</title>
<style>
  :root { --bg:#f0f2f5; --card:#fff; --text:#1a1a1a; --primary:#0066cc; --secondary:#555; --success:#008000; --soon:#d4edda; --border:#ddd; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  header{padding:6px 10px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:10px;}
  h1{font-size:1.1rem;color:var(--primary);white-space:nowrap;}
  .clock{font-size:1rem;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
  select#scenarioSelect{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.85rem;background:#fff;flex:1;max-width:240px;}
  .content{flex:1;overflow:auto;padding:6px;}
  .panel{display:none;height:100%;}
  .panel.active{display:block;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:100%;align-content:start;}
  .route-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .route-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .route-no{font-size:1.1rem;font-weight:700;color:var(--primary);}
  .dest{font-size:0.7rem;color:var(--secondary);text-align:right;max-width:50%;line-height:1.2;}
  .etas{display:flex;flex-direction:column;gap:3px;flex:1;}
  .eta{background:#f8f9fa;border-radius:5px;padding:4px;text-align:center;font-variant-numeric:tabular-nums;}
  .eta.soon{background:var(--soon);border:1px solid var(--success);}
  .eta .time{font-size:0.9rem;font-weight:600;}
  .eta .remain{font-size:0.7rem;color:var(--success);margin-top:1px;}
  .village-bus .eta{background:#fff3cd;}
  .loading,.error{grid-column:1/-1;text-align:center;padding:40px;color:var(--secondary);}
  footer{font-size:0.65rem;color:var(--secondary);text-align:center;padding:3px;background:#fff;border-top:1px solid var(--border);flex-shrink:0;}
</style>
</head>
<body>
<header>
  <h1>香港交通到站</h1>
  <select id="scenarioSelect">
    <option value="1">情景一：文康弦返學</option>
    <option value="2">情景二：置樂去何文田</option>
    <option value="3">情景三：置樂返藍地</option>
    <option value="4">情景四：返工去何文田</option>
    <option value="5">情景五：放工返置樂</option>
  </select>
  <div class="clock" id="clock">--:--:--</div>
</header>
<div class="content">
  <div id="panel-1" class="panel active"><div id="content1" class="grid"><div class="loading">載入中...</div></div></div>
  <div id="panel-2" class="panel"><div id="content2" class="grid"><div class="loading">載入中...</div></div></div>
  <div id="panel-3" class="panel"><div id="content3" class="grid"><div class="loading">載入中...</div></div></div>
  <div id="panel-4" class="panel"><div id="content4" class="grid"><div class="loading">載入中...</div></div></div>
  <div id="panel-5" class="panel"><div id="content5" class="grid"><div class="loading">載入中...</div></div></div>
</div>
<footer>數據來源：data.gov.hk 公開 API + 邨巴時間表。實時倒數至秒跳動。API 每15秒更新。</footer>
<script>
const clockEl=document.getElementById('clock');
function updateClock(){clockEl.textContent=new Date().toLocaleTimeString('zh-HK',{hour12:false});}
setInterval(updateClock,1000);updateClock();
const select=document.getElementById('scenarioSelect');
select.addEventListener('change',()=>{
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+select.value).classList.add('active');
  renderActive();
});
const SCENARIO1_ROUTES=[{route:'53',stop:'46D1A9FD1F84CA5C',service:'1',note:'藍地→華都',alightMin:11},{route:'63X',stop:'46D1A9FD1F84CA5C',service:'1',note:'藍地→華都',alightMin:11},{route:'68A',stop:'46D1A9FD1F84CA5C',service:'1',note:'藍地→華都',alightMin:11},{route:'258P',stop:'46D1A9FD1F84CA5C',service:'1',note:'藍地→華都',alightMin:11},{route:'261',stop:'46D1A9FD1F84CA5C',service:'1',note:'藍地→華都',alightMin:11}];
const SCENARIO3_ROUTES=[{route:'53',stop:'459BE083B86A8337',service:'1',note:'置樂→藍地',alightMin:8}];
const MTR_BUS_ROUTES=['K51','K52','K53'];
let liveData={s1:[], s2:'', s3:'', s4:'', s5:''};
async function fetchKMBETA(stopId,route,serviceType='1'){try{const res=await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/${serviceType}`);if(!res.ok)throw new Error();const data=await res.json();return data.data||[];}catch(e){return[];}}
async function fetchLightRail(stationId=350){try{const res=await fetch(`https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${stationId}&with_special=1`);if(!res.ok)throw new Error();return await res.json();}catch(e){return null;}}
async function fetchMTRBus(routeName){try{const res=await fetch('https://rt.data.gov.hk/v1/transport/mtr/bus/getSchedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:'zh',routeName})});if(!res.ok)throw new Error();return await res.json();}catch(e){return null;}}
async function fetchMTRTrain(line,sta){try{const res=await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}`);if(!res.ok)throw new Error();return await res.json();}catch(e){return null;}}
function formatRemain(etaIso){if(!etaIso)return{text:'--',seconds:Infinity,soon:false};const eta=new Date(etaIso);const now=new Date();const seconds=Math.max(0,Math.floor((eta-now)/1000));const mins=Math.floor(seconds/60);const secs=seconds%60;const text=mins>0?`${mins}分${secs.toString().padStart(2,'0')}秒`:`${secs}秒`;return{text,seconds,soon:seconds<90};}
function formatSeconds(sec){sec=Math.max(0,parseInt(sec)||0);if(sec>36000)return{text:'未有資料',seconds:Infinity,soon:false};const mins=Math.floor(sec/60);const secs=sec%60;const text=mins>0?`${mins}分${secs.toString().padStart(2,'0')}秒`:`${secs}秒`;return{text,seconds:sec,soon:sec<90};}
function getVillageBusNext(){const now=new Date();const candidates=[];for(let h=now.getHours();h<=now.getHours()+2;h++){for(const m of [10,40]){const t=new Date(now);t.setHours(h,m,0,0);if(t>now)candidates.push(t);}}candidates.sort((a,b)=>a-b);return candidates.slice(0,3);}
function renderVillageBus(){const nexts=getVillageBusNext();const etaHtml=nexts.map(t=>{const rem=formatRemain(t.toISOString());return `<div class="eta ${rem.soon?'soon':''}"><div class="time">${t.toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'})}</div><div class="remain">${rem.text}</div></div>`;}).join('');return `<div class="route-card village-bus"><div class="route-header"><span class="route-no">邨巴</span><span class="dest">每小時 :10 / :40 出發</span></div><div class="etas">${etaHtml}</div></div>`;}
async function loadS1(){const results=[];for(const r of SCENARIO1_ROUTES){const etas=await fetchKMBETA(r.stop,r.route,r.service);if(etas.length){results.push({route:r.route,dest:etas[0].dest_tc,etas,note:r.note,alightMin:r.alightMin});}}liveData.s1=results;}
function renderS1(){const container=document.getElementById('content1');if(!liveData.s1.length){container.innerHTML='<div class="error">暫時無法取得數據</div>';return;}let html=liveData.s1.map(r=>{const etaHtml=r.etas.slice(0,3).map(e=>{const rem=formatRemain(e.eta);const alightTime=new Date(new Date(e.eta).getTime()+(r.alightMin||10)*60*1000);const alight=formatRemain(alightTime.toISOString());return `<div class="eta ${rem.soon?'soon':''}"><div class="time">到站 ${rem.text}</div><div class="remain">落車 ${alight.text}</div></div>`;}).join('');return `<div class="route-card"><div class="route-header"><span class="route-no">${r.route}</span><span class="dest">${r.note}<br>${r.dest}</span></div><div class="etas">${etaHtml}</div></div>`;}).join('');container.innerHTML=html;}
async function loadS2(){let html='';for(const route of MTR_BUS_ROUTES){const data=await fetchMTRBus(route);if(!data||!data.busStop)continue;const chiLok=data.busStop.find(s=>s.busStopId&&(s.busStopId.includes('D180')||s.busStopId.includes('nU100')||s.busStopId.includes('D160')));if(chiLok&&chiLok.bus&&chiLok.bus.length){const etaHtml=chiLok.bus.slice(0,3).map(b=>{const rem=formatSeconds(b.arrivalTimeInSecond);return `<div class="eta ${rem.soon?'soon':''}"><div class="time">${rem.text}</div></div>`;}).join('');html+=`<div class="route-card"><div class="route-header"><span class="route-no">${route}</span><span class="dest">置樂→屯門站</span></div><div class="etas">${etaHtml}</div></div>`;}}const mtr=await fetchMTRTrain('WRL','TUM');if(mtr&&mtr.data&&mtr.data['WRL-TUM']){const trains=mtr.data['WRL-TUM'].DOWN||mtr.data['WRL-TUM'].UP||[];const etaHtml=trains.slice(0,3).map(t=>{const rem=formatRemain(t.time);return `<div class="eta ${rem.soon?'soon':''}"><div class="time">${t.time.slice(11,16)}</div><div class="remain">${rem.text}</div></div>`;}).join('');html+=`<div class="route-card"><div class="route-header"><span class="route-no">西鐵</span><span class="dest">屯門站開車</span></div><div class="etas">${etaHtml}</div></div>`;}liveData.s2=html||'<div class="error">暫時無數據</div>';}
function renderS2(){document.getElementById('content2').innerHTML=liveData.s2;}
async function loadS3(){const results=[];for(const r of SCENARIO3_ROUTES){const etas=await fetchKMBETA(r.stop,r.route,r.service);if(etas.length){results.push({route:r.route,dest:etas[0].dest_tc,etas,note:r.note,alightMin:r.alightMin});}}let html=results.map(r=>{const etaHtml=r.etas.slice(0,3).map(e=>{const rem=formatRemain(e.eta);const alightTime=new Date(new Date(e.eta).getTime()+(r.alightMin||8)*60*1000);const alight=formatRemain(alightTime.toISOString());return `<div class="eta ${rem.soon?'soon':''}"><div class="time">到站 ${rem.text}</div><div class="remain">落車 ${alight.text}</div></div>`;}).join('');return `<div class="route-card"><div class="route-header"><span class="route-no">${r.route}</span><span class="dest">${r.note}<br>${r.dest}</span></div><div class="etas">${etaHtml}</div></div>`;}).join('');html+=renderVillageBus();liveData.s3=html||'<div class="error">暫時無數據</div>';}
function renderS3(){document.getElementById('content3').innerHTML=liveData.s3;}
async function loadS4(){const data=await fetchLightRail(350);let html='';if(data&&data.platform_list){const plat=data.platform_list.find(p=>p.platform_id===2)||data.platform_list[1];if(plat){const routes={};plat.route_list.forEach(tr=>{if(!routes[tr.route_no])routes[tr.route_no]=[];routes[tr.route_no].push(tr);});for(const [route,trains] of Object.entries(routes)){const dest=trains[0].dest_ch;const etaHtml=trains.slice(0,3).map(tr=>{let secs=Infinity;if(tr.time_en&&tr.time_en!=='-'){const m=tr.time_en.match(/(\d+)/);if(m)secs=parseInt(m[1])*60;}const f=formatSeconds(secs);return `<div class="eta ${f.soon?'soon':''}"><div class="time">${tr.time_ch||tr.time_en||'即將'}</div><div class="remain">${f.text}</div></div>`;}).join('');html+=`<div class="route-card"><div class="route-header"><span class="route-no">${route}</span><span class="dest">往 ${dest}</span></div><div class="etas">${etaHtml}</div></div>`;}}}const mtr=await fetchMTRTrain('WRL','SIH');if(mtr&&mtr.data&&mtr.data['WRL-SIH']){const trains=mtr.data['WRL-SIH'].DOWN||mtr.data['WRL-SIH'].UP||[];const etaHtml=trains.slice(0,3).map(t=>{const rem=formatRemain(t.time);return `<div class="eta ${rem.soon?'soon':''}"><div class="time">${t.time.slice(11,16)}</div><div class="remain">${rem.text}</div></div>`;}).join('');html+=`<div class="route-card"><div class="route-header"><span class="route-no">西鐵</span><span class="dest">兆康站開車</span></div><div class="etas">${etaHtml}</div></div>`;}liveData.s4=html||'<div class="error">暫時無數據</div>';}
function renderS4(){document.getElementById('content4').innerHTML=liveData.s4;}
async function loadS5(){let html='';const mtr=await fetchMTRTrain('KTL','HOM');if(mtr&&mtr.data&&mtr.data['KTL-HOM']){const trains=mtr.data['KTL-HOM'].UP||mtr.data['KTL-HOM'].DOWN||[];const etaHtml=trains.slice(0,3).map(t=>{const rem=formatRemain(t.time);return `<div class="eta ${rem.soon?'soon':''}"><div class="time">${t.time.slice(11,16)}</div><div class="remain">${rem.text}</div></div>`;}).join('');html+=`<div class="route-card"><div class="route-header"><span class="route-no">觀塘</span><span class="dest">何文田 → 屯門方向</span></div><div class="etas">${etaHtml}</div></div>`;}for(const route of MTR_BUS_ROUTES){const data=await fetchMTRBus(route);if(!data||!data.busStop)continue;const tmStop=data.busStop.find(s=>s.busStopId&&(s.busStopId.includes('D100')||s.busStopId.includes('D110')||s.busStopId.includes('nD100'))) || data.busStop[5] || data.busStop[0];if(tmStop&&tmStop.bus&&tmStop.bus.length){const etaHtml=tmStop.bus.slice(0,3).map(b=>{const rem=formatSeconds(b.arrivalTimeInSecond);return `<div class="eta ${rem.soon?'soon':''}"><div class="time">${rem.text}</div></div>`;}).join('');html+=`<div class="route-card"><div class="route-header"><span class="route-no">${route}</span><span class="dest">屯門站 → 恆順園</span></div><div class="etas">${etaHtml}</div></div>`;}}liveData.s5=html||'<div class="error">暫時無數據</div>';}
function renderS5(){document.getElementById('content5').innerHTML=liveData.s5;}
function renderActive(){
  const v=select.value;
  if(v==='1') renderS1();
  else if(v==='2') renderS2();
  else if(v==='3') renderS3();
  else if(v==='4') renderS4();
  else if(v==='5') renderS5();
}
setInterval(renderActive,1000);
async function refreshAll(){await loadS1();await loadS2();await loadS3();await loadS4();await loadS5();renderActive();}refreshAll();setInterval(refreshAll,15000);
</script>
</body>
</html>
